<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="battGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <linearGradient id="solGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffaa00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b35"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1240" height="860" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="60" y="58" fill="#ff6b35" font-size="30" font-weight="700">21 W Bulb Test — Solenoid Bench Check</text>
  <text x="60" y="90" fill="#9a9a9a" font-size="18">2010 Scion xB · U241E · SL1 / SL2 / SLT · FSM SST substitute</text>
  <line x1="60" y1="112" x2="1180" y2="112" stroke="#333" stroke-width="2"/>

  <!-- ================= BATTERY ================= -->
  <g filter="url(#softShadow)">
    <rect x="60" y="360" width="200" height="150" rx="10" fill="url(#battGrad)" stroke="#555" stroke-width="2"/>
    <rect x="60" y="360" width="200" height="34" rx="10" fill="#2f2f2f"/>
    <text x="160" y="384" fill="#ccc" font-size="17" font-weight="700" text-anchor="middle">12 V BATTERY</text>
    <text x="160" y="452" fill="#e8e8e8" font-size="22" font-weight="700" text-anchor="middle">12 V</text>
    <text x="160" y="480" fill="#7a7a7a" font-size="14" text-anchor="middle">jump pack fine</text>
  </g>
  <!-- battery terminals -->
  <rect x="88" y="332" width="26" height="30" rx="4" fill="#c0392b"/>
  <text x="101" y="322" fill="#ff6b6b" font-size="20" font-weight="700" text-anchor="middle">+</text>
  <rect x="196" y="332" width="26" height="30" rx="4" fill="#2c3e50" stroke="#555"/>
  <text x="209" y="322" fill="#8ab4f8" font-size="22" font-weight="700" text-anchor="middle">−</text>

  <!-- ================= BULB ================= -->
  <circle cx="470" cy="425" r="95" fill="url(#glow)"/>
  <circle cx="470" cy="425" r="66" fill="#2b2b2b" stroke="#ffaa00" stroke-width="3"/>
  <!-- filament -->
  <path d="M448 470 L448 440 L462 410 L462 440 L476 410 L476 440 L490 410 L490 440 L492 470"
        fill="none" stroke="#ffcc44" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="470" cy="500" rx="26" ry="10" fill="#3a3a3a" stroke="#666" stroke-width="2"/>
  <text x="470" y="572" fill="#ffaa00" font-size="21" font-weight="700" text-anchor="middle">1156 bulb</text>
  <text x="470" y="598" fill="#9a9a9a" font-size="16" text-anchor="middle">~27 W incandescent</text>
  <text x="470" y="622" fill="#7a7a7a" font-size="14" text-anchor="middle">(1157 = use bright filament)</text>
  <!-- bulb terminal posts -->
  <rect x="404" y="392" width="18" height="14" rx="3" fill="#888"/>
  <rect x="518" y="392" width="18" height="14" rx="3" fill="#888"/>

  <!-- ================= SOLENOID ================= -->
  <g filter="url(#softShadow)">
    <rect x="760" y="368" width="250" height="118" rx="12" fill="url(#solGrad)" stroke="#666" stroke-width="2"/>
    <rect x="782" y="392" width="206" height="20" rx="6" fill="#1e1e22"/>
    <rect x="782" y="420" width="206" height="20" rx="6" fill="#1e1e22"/>
    <text x="885" y="466" fill="#bbb" font-size="16" font-weight="700" text-anchor="middle">SHIFT SOLENOID</text>
  </g>
  <!-- pigtail connector -->
  <path d="M760 405 L690 385" stroke="#222" stroke-width="16" stroke-linecap="round"/>
  <path d="M760 445 L690 462" stroke="#222" stroke-width="16" stroke-linecap="round"/>
  <circle cx="686" cy="384" r="9" fill="#c0392b" stroke="#ff8888" stroke-width="2"/>
  <circle cx="686" cy="463" r="9" fill="#c0392b" stroke="#ff8888" stroke-width="2"/>
  <text x="700" y="352" fill="#ff9a9a" font-size="19" font-weight="700">Terminal 2</text>
  <text x="700" y="512" fill="#ff9a9a" font-size="19" font-weight="700">Terminal 1</text>

  <!-- ================= WIRES ================= -->
  <!-- 1: battery + to bulb -->
  <path d="M101 332 L101 200 L404 200 L404 399" fill="none" stroke="#e74c3c" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 2: bulb to terminal 2 -->
  <path d="M536 399 L536 250 L686 250 L686 384" fill="none" stroke="#e74c3c" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 3: terminal 1 back to battery - -->
  <path d="M686 463 L686 700 L209 700 L209 362" fill="none" stroke="#5dade2" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- numbered callouts -->
  <circle cx="101" cy="200" r="20" fill="#ff6b35"/><text x="101" y="208" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">1</text>
  <circle cx="536" cy="250" r="20" fill="#ff6b35"/><text x="536" y="258" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">2</text>
  <circle cx="686" cy="700" r="20" fill="#ff6b35"/><text x="686" y="708" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">3</text>

  <!-- lead labels -->
  <text x="150" y="182" fill="#e74c3c" font-size="17" font-weight="600">battery (+) lead</text>
  <text x="470" y="232" fill="#e74c3c" font-size="17" font-weight="600">bulb → terminal 2</text>
  <text x="230" y="726" fill="#5dade2" font-size="17" font-weight="600">terminal 1 → battery (−) lead</text>

  <!-- current direction arrows -->
  <path d="M300 200 L340 200" stroke="#ff6b35" stroke-width="4" marker-end="url(#arrowR)"/>
  <path d="M600 250 L640 250" stroke="#ff6b35" stroke-width="4" marker-end="url(#arrowR)"/>
  <path d="M420 700 L380 700" stroke="#ff6b35" stroke-width="4" marker-end="url(#arrowR)"/>

  <!-- ================= NOTES PANEL ================= -->
  <rect x="60" y="760" width="1120" height="72" rx="10" fill="#1e1e1e" stroke="#333" stroke-width="1.5"/>
  <text x="84" y="790" fill="#ffaa00" font-size="17" font-weight="700">GOOD = the valve MOVES and makes an audible CLICK with each touch of the lead.</text>
  <text x="84" y="816" fill="#9a9a9a" font-size="16">NO CLICK / weak / hot coil = replace.  The bulb is only a current limiter — never jumper the solenoid straight to the battery.</text>
</svg>
